; Exercise OPcache's stock persistent file cache without creating process-local
; shared memory. The harness appends a generated INI directory containing the
; run-specific absolute cache path for both the PHPStan parent and all workers.
opcache.enable_cli=1
opcache.file_cache_only=1
opcache.file_cache_consistency_checks=0
opcache.jit=disable
opcache.jit_buffer_size=0
