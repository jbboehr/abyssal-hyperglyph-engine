; PHPStan is distributed as a PHAR. OPcache cannot obtain timestamps for the
; PHAR's internal stream entries, so either of these checks prevents those
; entries from being cached at all.
;
; This profile is only safe for an immutable, pinned benchmark checkout. Stop
; the AHE broker before changing PHPStan or any executable project dependency.
opcache.validate_timestamps=0
opcache.file_update_protection=0
opcache.memory_consumption=512
opcache.max_accelerated_files=100000
